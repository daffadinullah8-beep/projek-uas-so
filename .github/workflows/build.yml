name: Build Multi-Platform Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build standalone backend
        run: |
          python -m pip install -r server/requirements.txt pyinstaller
          pyinstaller --onefile --collect-all uvicorn --name aether-backend --distpath backend-dist server/server.py

      - name: Ensure Linux backend is executable
        if: matrix.os == 'ubuntu-latest'
        run: chmod 755 backend-dist/aether-backend

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Build for Linux (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OS-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish latest GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Aether-OS-*
          path: release-assets
          merge-multiple: true

      - name: Move latest tag to this build
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: git push --force origin "${COMMIT_SHA}:refs/tags/latest"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build from main
          body: Automatically updated build from the main branch.
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
